name: Apply audited party level-11 milestone
on:
  push:
    branches: [feature/havengard-party-level-11-20261025]
    paths:
      - 'transactions/live/PARTY-LEVEL-11-20261025.json'
      - '.github/workflows/apply-party-level11.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: havengard-level11-milestone
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview transaction against live canonical state
        run: python tools/campaignctl.py --project . preview --transaction transactions/live/PARTY-LEVEL-11-20261025.json
      - name: Commit through campaign event engine and render dependent views
        run: |
          python tools/campaignctl.py --project . commit --transaction transactions/live/PARTY-LEVEL-11-20261025.json
          rm transactions/live/PARTY-LEVEL-11-20261025.json
      - name: Run campaign regressions and check all generated views
        run: python tools/run_tests.py
      - name: Verify exact level-11 state and unchanged world clock and funds
        run: |
          python - <<'PY'
          import json
          s=json.load(open('state/_campaign-state.json'))
          assert s['state_revision']==32
          assert [s['characters'][x]['character_sheet']['level'] for x in ('yar','daphne','lyutobor','rada')]==[11]*4
          assert {x:s['characters'][x]['resources']['hp']['max'] for x in ('yar','daphne','lyutobor','rada')}=={'yar':125,'daphne':68,'lyutobor':114,'rada':69}
          assert s['world']['timekeeping']['elapsed_seconds_from_anchor']==432000
          assert s['characters']['daphne']['resources']['spell_slots']['6']=={'current':1,'max':1}
          assert s['characters']['lyutobor']['resources']['channel_divinity']=={'current':3,'max':3}
          assert s['characters']['daphne']['resources']['prepared_spells']['current']==16
          assert s['applied_events']['PARTY-LEVEL-11-20261025']['revision']==32
          print('level-11 canon validated')
          PY
      - name: Publish authoritative state, receipt and derived views
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/_campaign-state.json views/ transactions/applied/ transactions/live/
          git commit -m 'feat(campaign): commit level-11 milestone through event engine [skip ci]'
          git -c pull.rebase=true pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
