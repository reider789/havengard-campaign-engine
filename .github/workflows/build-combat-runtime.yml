name: Refresh Havengard combat manifest
on:
  push:
    branches: [main]
    paths:
      - 'state/**'
      - 'migrations/character-g1m8-*'
      - 'prototypes/combat/character-capability-registry-g1m8-v1.json'
      - 'prototypes/combat/inventory-interactions-g1m8-v1.json'
      - 'prototypes/combat/app/build_runtime.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate private battle data
        run: python prototypes/combat/app/build_runtime.py --root .
      - name: Commit only if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/combat/app/runtime/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(combat): refresh private tactical runtime snapshot"
            git push
          fi