name: Build in-chat combat bundle
on:
  push:
    branches: [main]
    paths:
      - 'state/_campaign-state.json'
      - 'prototypes/chat-combat/engine-v21.html'
      - 'prototypes/chat-combat/visual_skin.js'
      - 'prototypes/chat-combat/build_chat_bundle.py'
      - 'prototypes/chat-combat/tests/**'
      - '.github/workflows/build-chat-combat.yml'
      - 'prototypes/combat/character-capability-registry-g1m8-v1.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chat-combat-bundle
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundle builder and source-data synchronization
        run: python prototypes/chat-combat/tests/test_bundle.py
      - name: Build chat-only bundle from current canonical state
        run: python prototypes/chat-combat/build_chat_bundle.py --root .
      - name: Check embedded JavaScript syntax
        run: |
          python -c "from pathlib import Path; x=Path('prototypes/chat-combat/engine-v21.html').read_text(); Path('/tmp/havengard-v21.js').write_text(x.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/havengard-v21.js
      - name: Install browser for real end-to-end regression
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run v21 packaged chat battle scenarios
        run: python prototypes/chat-combat/tests/qa_v21.py
      - name: Check illustrated board and offline art workflow
        run: python prototypes/chat-combat/tests/qa_art_skin.py
      - name: Check detailed Russian logs, Web control and randomized training arenas
        run: python prototypes/chat-combat/tests/qa_v21_detail_and_web.py
      - name: Generate checksum for offline ChatGPT file loader
        run: python prototypes/chat-combat/build_inline_payload.py
      - name: Browser-test canonical story handoff
        run: python prototypes/chat-combat/tests/qa_v21_story.py
      - name: Commit only generated chat files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/chat-combat/current-chat-battle.html prototypes/chat-combat/current-manifest.json prototypes/chat-combat/current-chat-battle.gzip.b64 prototypes/chat-combat/inline-payload-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(chat-combat): sync self-contained battle data from canon [skip ci]'
            git -c pull.rebase=true pull --rebase origin main
            git push origin HEAD:main
          fi