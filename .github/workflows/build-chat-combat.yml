name: Build in-chat combat bundle
on:
  push:
    branches: [main]
    paths:
      - 'state/_campaign-state.json'
      - 'prototypes/chat-combat/engine-v20.html'
      - 'prototypes/chat-combat/build_chat_bundle.py'
      - '.github/workflows/build-chat-combat.yml'
      - 'prototypes/combat/character-capability-registry-g1m8-v1.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chat-combat-bundle
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundle builder and source-data synchronization
        run: python prototypes/chat-combat/tests/test_bundle.py
      - name: Build chat-only bundle from current canonical state
        run: python prototypes/chat-combat/build_chat_bundle.py --root .
      - name: Commit only generated chat files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/chat-combat/current-chat-battle.html prototypes/chat-combat/current-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(chat-combat): sync self-contained battle data from canon [skip ci]'
            git -c pull.rebase=true pull --rebase origin main
            git push origin HEAD:main
          fi