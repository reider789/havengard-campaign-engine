name: Shared desktop combat
on:
  pull_request:
    branches: [main]
    paths:
      - 'state/_campaign-state.json'
      - 'prototypes/shared-combat/**'
      - 'prototypes/chat-combat/**'
      - 'tools/*combat*.py'
      - 'tools/test_shared*'
      - 'tools/sync_time_dependent_state.py'
      - '.github/workflows/build-chat-combat.yml'
  push:
    branches: [main]
    paths:
      - 'state/_campaign-state.json'
      - 'prototypes/shared-combat/**'
      - 'prototypes/chat-combat/art/**'
      - 'tools/*combat*.py'
      - 'tools/test_shared*'
      - 'tools/sync_time_dependent_state.py'
      - '.github/workflows/build-chat-combat.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read pinned shared engine
        id: engine
        run: |
          python - <<'PY'
          import json,os,re
          lock=json.load(open('prototypes/shared-combat/engine-lock.json'))
          assert re.fullmatch('[0-9a-f]{40}',lock['commit'])
          assert lock['repository']=='reider789/rin_dnd' and lock['canonical_migration_complete'] is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+lock['commit']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: reider789/rin_dnd
          ref: ${{ steps.engine.outputs.commit }}
          path: .shared-combat
          persist-credentials: false
      - name: Verify pin and full party readiness
        run: python tools/check_shared_combat.py --engine-root .shared-combat --require-ready
      - name: Verify complete battles and campaign handoff on copies
        run: python tools/test_shared_handoff.py .shared-combat
      - name: Build desktop delivery from current canon
        run: python tools/build_shared_combat.py --engine-root .shared-combat
      - name: Verify reproducible committed artifacts
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- prototypes/shared-combat/party-pack.json prototypes/shared-combat/migration-audit.json prototypes/chat-combat/desktop-battle.html prototypes/chat-combat/current-chat-battle.html prototypes/chat-combat/entrypoint.json prototypes/chat-combat/current-manifest.json
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify real desktop controls and reaction checkpoint
        run: python tools/test_shared_browser.py
      - name: Save generated desktop artifacts
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/shared-combat/party-pack.json prototypes/shared-combat/migration-audit.json prototypes/chat-combat/desktop-battle.html prototypes/chat-combat/current-chat-battle.html prototypes/chat-combat/entrypoint.json prototypes/chat-combat/current-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh shared desktop combat snapshot [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
