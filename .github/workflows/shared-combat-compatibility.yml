name: Manual shared engine verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: engine
        run: echo "commit=$(python -c 'import json; print(json.load(open("prototypes/shared-combat/engine-lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: reider789/rin_dnd
          ref: ${{ steps.engine.outputs.commit }}
          path: .shared-combat
      - run: python tools/check_shared_combat.py --engine-root .shared-combat --require-ready
