name: Verify Scene Knowledge

# Rendering is owned by campaignctl's transaction pipeline. This workflow is
# deliberately read-only: there must not be a second bot writing the same state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/knowledgegraph.py --project . check
      - run: python tools/campaignctl.py --project . check-views
