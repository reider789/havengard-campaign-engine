name: Apply Live Campaign Transaction

on:
  push:
    branches: [main]
    paths: ['transactions/live/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-state-writer
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply, validate and publish from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name campaign-engine-bot
          git config user.email campaign-engine-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B campaign-publish origin/main
            python tools/apply_live.py --project .
            # Rebuild the published combat pack from the new canonical state
            # before regression tests compare profiles, resources and hashes.
            python -c 'import json; from pathlib import Path; from tools.build_party_combat_pack import build, BASE_RESOURCES; source=json.loads(Path("state/_campaign-state.json").read_text(encoding="utf-8")); target=Path("prototypes/shared-combat/party-pack.json"); old=json.loads(target.read_text(encoding="utf-8")); counters=set().union(*(set(c["resources"]) for c in old["characters"].values())); pack=build(source,{"counters":sorted(counters-BASE_RESOURCES)}); target.write_text(json.dumps(pack,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")'
            python tools/run_tests.py
            git add -A state views transactions prototypes/shared-combat/party-pack.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "[state-applied] Apply live campaign transaction"
            if git push origin HEAD:main; then
              exit 0
            fi
            # A concurrent push won. Rebuild from its state and the still-pending
            # files; never force-push or rebase already-computed game outcomes.
          done
          echo 'Main kept changing. Re-run this workflow; do not create duplicate event IDs.'
          exit 1
