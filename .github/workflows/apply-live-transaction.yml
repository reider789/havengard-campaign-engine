name: Apply Live Campaign Transaction

on:
  push:
    branches: [main]
    paths:
      - 'transactions/live/*.json'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply pending live transactions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          txs=(transactions/live/*.json)
          if [ ${#txs[@]} -eq 0 ]; then
            echo "No live transactions to apply."
            exit 0
          fi
          for tx in "${txs[@]}"; do
            echo "Applying $tx"
            python tools/campaignctl.py --project . preview --transaction "$tx"
            python tools/campaignctl.py --project . commit --transaction "$tx"
          done

      - name: Synchronize time-dependent state
        run: |
          python tools/sync_time_dependent_state.py --project .
          python tools/campaignctl.py --project . render

      - name: Validate and render NPC/thread knowledge slice
        run: |
          python tools/knowledgegraph.py --project . check
          python tools/knowledgegraph.py --project . render

      - name: Run regression tests after state update
        run: |
          python tests/test_mvp.py
          python tests/test_road_return.py
          python tests/test_relationships_and_rules.py
          python tests/test_time_dependent_state.py
          python tests/test_knowledge_graph.py

      - name: Archive applied transactions and commit authoritative state
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          txs=(transactions/live/*.json)
          if [ ${#txs[@]} -eq 0 ]; then
            exit 0
          fi
          mkdir -p transactions/applied
          for tx in "${txs[@]}"; do
            mv "$tx" transactions/applied/
          done
          git config user.name "campaign-engine-bot"
          git config user.email "campaign-engine-bot@users.noreply.github.com"
          git add state views transactions/applied transactions/live
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "[state-applied] Apply live campaign transaction"
          git push
