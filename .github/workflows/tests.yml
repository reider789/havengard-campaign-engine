name: Campaign Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'state/**'
      - 'rules/**'
      - 'views/**'
      - 'tools/**'
      - 'tests/**'
      - 'config/**'
      - 'migrations/**'
      - 'map/**'
      - 'transactions/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'state/**'
      - 'rules/**'
      - 'views/**'
      - 'tools/**'
      - 'tests/**'
      - 'config/**'
      - 'migrations/**'
      - 'map/**'
      - 'transactions/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All regressions and derived-view consistency
        run: python tools/run_tests.py
